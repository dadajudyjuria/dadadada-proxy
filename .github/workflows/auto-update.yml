name: Auto Update Stream Link

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install axios

      - name: Run update script
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
          STREAM_URL: ${{ secrets.STREAM_URL }}
          CHANNEL: 'ch1'
        run: node update.js
